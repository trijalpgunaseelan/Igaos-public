# Cloud Build needs to be told the Dockerfile is not at the repository root.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "deploy/Dockerfile", "-t", "${_IMAGE}", "."]
images: ["${_IMAGE}"]
options:
  machineType: E2_HIGHCPU_8      # the C++ build is the slow part
timeout: 1200s
