# Any VPS with Docker: docker compose -f deploy/docker-compose.yml up -d --build
# Caddy terminates TLS and gets a certificate automatically once DNS points here.
services:
  studio:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      IGAOS_TIME_LIMIT: "20"
      IGAOS_MAX_CONCURRENT: "2"
      IGAOS_THREADS: "1"
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1g
    expose: ["8420"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [studio]

volumes:
  caddy_data:
  caddy_config:
